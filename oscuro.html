<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biorreactor · Biotecnología</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

.br{--br-cavity:#0e1012;--br-water:#11161a;--br-reagent:#141a1e;--br-screen:#0b1210;--br-screen-ink:#7fe0b0;--br-led-off:#2a2a2a;--br-led-on:#7fe0b0;--br-led-warn:#ffb15c}
.iso[data-theme="light"] .br{--br-cavity:#eef0f1;--br-water:#e8eff3;--br-reagent:#e6edf2;--br-screen:#1d2422;--br-screen-ink:#9ff0c6;--br-led-off:#c9c9cc;--br-led-on:#1f9d63;--br-led-warn:#d9822b}
.br .br-glass-back{fill:var(--br-cavity)}
.br .br-water{fill:var(--br-water)}
.br .br-reagent{fill:var(--br-reagent)}
.br .br-waste{fill:#cdaa5f;opacity:.45}
.br .br-flow{fill:none;stroke:var(--anatomy-hi);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:.01 3.6;opacity:0;transition:opacity .4s}
.br[data-mode="chemo"] .br-flow{opacity:.7}
.br .br-cell{fill:#8a6a28;opacity:.7}
.iso:not([data-theme="light"]) .br .br-cell{fill:#f0d9a0;opacity:.65}
.br .br-drop{fill:#e8d9a8;stroke:var(--anatomy-mid);stroke-width:.35}
.br-viz{--viz-s1:#3987e5;--viz-s2:#d95926;--viz-band:#ffffff0d;--viz-grid:#ffffff14;padding:4px 18px 16px}
.iso[data-theme="light"] .br-viz{--viz-s1:#2a78d6;--viz-s2:#eb6834;--viz-band:#0000000a;--viz-grid:#0000000f}
.br-viz-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--anatomy-text);margin:4px 0 6px}
.br-viz-legend span{display:inline-flex;align-items:center;gap:6px}
.br-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 20px}
.br-chart{margin:0;position:relative}
.br-chart figcaption{font-size:12px;color:var(--anatomy-strong);margin-bottom:2px}
.br-chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none}
.br-chart .ax{font:9px var(--anatomy-mono);fill:var(--anatomy-muted)}
.br-chart .grid{stroke:var(--viz-grid);stroke-width:1}
.br-chart .base{stroke:var(--anatomy-lo);stroke-width:1}
.br-chart .band{fill:var(--viz-band)}
.br-chart .model{fill:none;stroke:var(--viz-s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.br-chart .ref{stroke:var(--anatomy-mid);stroke-width:1;stroke-dasharray:4 3}
.br-chart .run{fill:var(--anatomy-card);stroke:var(--viz-s2);stroke-width:2}
.br-chart .op{fill:var(--anatomy-strong);stroke:var(--anatomy-card);stroke-width:2}
.br-chart .lbl{font:10px var(--anatomy-mono);fill:var(--anatomy-text)}
.br-chart .hair{stroke:var(--anatomy-mid);stroke-width:1}
.br-tip{position:absolute;pointer-events:none;background:var(--anatomy-card);border:1px solid var(--anatomy-lo);border-radius:6px;padding:5px 8px;font-size:11px;line-height:1.4;color:var(--anatomy-text);white-space:nowrap;box-shadow:0 4px 12px #0003}
.br-tip strong{color:var(--anatomy-strong);font-family:var(--anatomy-mono);font-weight:600}
.br-table{margin-top:8px;font-size:12px;color:var(--anatomy-text)}
.br-table summary{cursor:pointer}
.br-table table{border-collapse:collapse;margin-top:6px;font-family:var(--anatomy-mono);font-size:11px}
.br-table th,.br-table td{padding:3px 10px;text-align:right;border-bottom:1px solid var(--anatomy-faint)}
.br-table th{color:var(--anatomy-strong);font-weight:500}
.br .br-medium{fill:var(--br-medium,#d9566b);opacity:var(--br-alpha,.42)}
.br .br-medium-top{fill:var(--br-medium,#d9566b);opacity:calc(var(--br-alpha,.42) + .13)}
.br .br-meniscus{stroke:var(--br-medium,#d9566b);opacity:.9}
.br .br-bubble{fill:var(--anatomy-paper);fill-opacity:.35;stroke:var(--anatomy-hi);stroke-width:.45}
.br .br-bezel{fill:var(--anatomy-shade-1);stroke:var(--anatomy-lo);stroke-width:.4}
.br .br-screen{fill:var(--br-screen);stroke:var(--anatomy-mid);stroke-width:.4}
.br .br-screen-text text{fill:var(--br-screen-ink);font:4.2px var(--anatomy-mono)}
.br .br-screen-text .br-screen-key{opacity:.6}
.br .br-led{fill:var(--br-led-off)}
.br .br-led[data-on]{fill:var(--br-led-on)}
.br .br-led[data-warn]{fill:var(--br-led-warn)}
.br .br-led-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.4}
.br .br-plate{fill:var(--anatomy-shade-2);stroke:var(--anatomy-lo);stroke-width:.4}
.br .br-slots rect{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.35}
.br-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 24px;margin:0 0 16px}
.br-meta{margin:0;display:grid;gap:4px;text-align:right}
.br-meta div{display:flex;gap:8px;justify-content:flex-end;align-items:baseline}
.br-meta dt{font:11px var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-muted)}
.br-meta dd{margin:0;font-size:14px;color:var(--anatomy-strong)}
@media (max-width:520px){.br-meta{text-align:left}.br-meta div{justify-content:flex-start}}
.br-head img{display:block;width:min(260px,62%);height:auto;background:#fff;padding:8px 12px;border-radius:10px;box-sizing:content-box}
.br-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 22px;padding:14px 18px 16px;border-top:1px solid var(--anatomy-faint)}
.br-controls label{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;color:var(--anatomy-text)}
.br-controls output{font-family:var(--anatomy-mono);color:var(--anatomy-strong);font-size:12px}
.br-controls input{grid-column:1 / -1;width:100%;accent-color:var(--anatomy-hi)}
.br-mode{display:flex;gap:6px;padding:14px 18px 0;flex-wrap:wrap;border-top:1px solid var(--anatomy-faint)}
.br-mode label{cursor:pointer}
.br-mode input{position:absolute;opacity:0;pointer-events:none}
.br-mode span{display:inline-block;padding:5px 12px;border:1px solid var(--anatomy-lo);border-radius:999px;font-size:12px;color:var(--anatomy-text)}
.br-mode input:checked+span{background:var(--anatomy-hi);border-color:var(--anatomy-hi);color:var(--anatomy-card)}
.br-mode input:focus-visible+span{outline:2px solid var(--anatomy-mid);outline-offset:2px}
.br [data-group]+[data-group]>.br-controls,.br [data-group]+[data-group].br-controls{border-top:none;padding-top:4px}
.br[data-mode="chemo"] [data-group="cell"],.br:not([data-mode="chemo"]) [data-group="chemo"]{display:none}
.br-params{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px;padding:0 18px 6px}
.br-num{display:grid;gap:3px;font-size:12px;color:var(--anatomy-text)}
.br-num input{font:12px var(--anatomy-mono);color:var(--anatomy-strong);background:var(--anatomy-paper);border:1px solid var(--anatomy-lo);border-radius:6px;padding:5px 8px;width:100%}

<details class="br-table"><summary>Ver tabla de corridas</summary><table><thead><tr><th>Corrida</th><th>D (s⁻¹)</th><th>S medido</th><th>X medido</th><th>S modelo</th><th>X modelo</th></tr></thead><tbody data-runs=""></tbody></table></details></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Eje y hélices de paleta inclinada a 45°</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Bombas: alimentación (izq.), cosecha por tubo de nivel (centro), base (der.)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Medio con rojo fenol: amarillo ácido, rojo neutro, violeta alcalino</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Burbujas del anillo rociador</span></span><span class="iso-caption">Vaso de 5 L con 3,5 L de medio (Ø 160 mm), dos hélices de 64 mm. El oxígeno que pasa del gas al líquido es kLa·(C* − C), con kLa = 0,026·(P/V)^0,4·vs^0,5 (van 't Riet), P = 2·Np·ρ·N³·D⁵ con Np = 1,3, más 0,4 h⁻¹ por la superficie; las células consumen 0,2 mmol/L/h por cada 10⁶ cél/mL. El pH sale del par bicarbonato/CO₂ (pH = 6,1 + log [HCO₃⁻]/(0,0307·pCO₂)) con gas al 5 % de CO₂; el lactato baja el bicarbonato y la bomba de base se enciende debajo de pH 7,15 y se apaga en 7,20. La camisa sigue la consigna con una constante de unos 9 min. El tiempo corre a 6 min de proceso por segundo. En modo quimiostato la bomba de alimentación entra medio con S0 y la de cosecha saca el mismo caudal por un tubo cuya boca f const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;

        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);

    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];

let lastText = 0;
function drawText(now) {

    text = "X " + fmt(culture.x, 2) + " g/L · S " + fmt(culture.s, 1) + " g/L · F " + fmt(chemo.d * chemo.volume, 1) + " L/s";
    root.style.setProperty("--br-medium", "rgb(205,170,95)");
    root.style.setProperty("--br-alpha", (0.1 + 0.55 * Math.min(1, culture.x / 1.2)).toFixed(3));

    const r = M.readings(state, shown);
    keys = ["T", "pH", "OD", "N"];
    lines = [fmt(r.temp, 1) + " °C", fmt(r.ph, 2), fmt(r.dissolved, 0) + " %", Math.round(shown.rpm) + " rpm"];
    text = "OD " + fmt(r.dissolved, 0) + " % · kLa " + fmt(r.kla, 1) + " h⁻¹ · pH " + fmt(r.ph, 2);

let frame = 0, last = 0, visible = false, touring = !still.matches, tourClock = 0;

function syncInputs() {

}
function label(key) {

function chemoLabel(key) {

function steadyText() {

  const dw = M.washout(chemo);

    ? "D ≥ Dlavado = " + fmt(dw, 2) + " s⁻¹: las células salen más rápido de lo que crecen. En estado estacionario X = 0 y S = S0 = " + fmt(chemo.s0, 1) + " g/L."

for (const [key, el] of Object.entries(chemoInputs)) {

function setMode(next) {

}
root.querySelectorAll("input[name=mode]").forEach((el) => el.addEventListener("change", () => setMode(el.value)));

let flowPhase = 0;
const cells = [];
const drops = [];
let dropDebt = 0;
function stepCells(dt, omega) {

}
function stepDrops(dt) {

  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].z < LEVEL + 0.6) drops.splice(i, 1);
  dropsG.innerHTML = drops.map((d) => {
    const s = pt([FEED_AT[0], FEED_AT[1], d.z]);
    return '<ellipse class="br-drop" cx="' + s[0].toFixed(1) + '" cy="' + s[1].toFixed(1) + '" rx="' + (0.75 * k).toFixed(2) + '" ry="' + (0.95 * k).toFixed(2) + '"/>';

}
const charts = [...root.querySelectorAll("[data-chart]")].map((fig) => ({ kind: fig.dataset.chart, fig, svg: fig.querySelector("svg"), tip: fig.querySelector(".br-tip") }));
const CH = { w: 320, h: 190, l: 38, r: 14, t: 14, b: 26, dmax: 2.2 };
function chartScale(kind) {
  const top = kind === "x" ? Math.max(1.4, Math.ceil(chemo.yield * chemo.s0 * 12) / 10) : Math.max(32, Math.ceil(chemo.s0 * 1.15 / 4) * 4);

const valueAt = (kind, d) => { const ss = M.chemostatSteady({ ...chemo, d }); return kind === "x" ? ss.x : ss.s; };

function drawCharts() {

      parts.push('<text class="lbl" x="' + (sx(dw) + 4).toFixed(1) + '" y="' + (CH.t + 10) + '">lavado</text>');

      parts.push('<text class="lbl" x="' + (CH.l + 4) + '" y="' + (sy(chemo.s0) - 4).toFixed(1) + '">S0 = ' + fmt(chemo.s0, 1) + "</text>");

    });
    parts.push('<circle class="op" cx="' + sx(Math.min(chemo.d, CH.dmax)).toFixed(1) + '" cy="' + sy(Math.min(top, valueAt(c.kind, chemo.d))).toFixed(1) + '" r="4.5"/>');
    parts.push('<line class="hair" data-hair="" x1="0" x2="0" y1="' + CH.t + '" y2="' + (CH.h - CH.b) + '" visibility="hidden"/>');

}
function showTip(c, event) {

for (const c of charts) {
